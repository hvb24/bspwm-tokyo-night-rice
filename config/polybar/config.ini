;==========================================================
;  Polybar - floating pill groups, Tokyo Night
;  Colours: colors.ini (generated from ~/.config/theme/palette.sh by apply.sh)
;  Start/restart with: ~/.config/polybar/launch.sh (monitors and hardware come from theme/machine.sh)
;  Earlier configs: config.ini.bak-*  and ~/rice-backups/
;==========================================================
include-file = ~/.config/polybar/colors.ini

[bar/base]
width = 100%:-24
height = 34
offset-x = 12
offset-y = 8
bottom = false
fixed-center = true
background = ${colors.transparent}
foreground = ${colors.foreground}
line-size = 2
padding = 0
module-margin = 0
font-0 = "FiraCode Nerd Font:size=11;3"
font-1 = "FiraCode Nerd Font:style=Bold:size=11;3"
font-2 = "FiraCode Nerd Font:size=13;3"
font-3 = "Noto Color Emoji:scale=8;2"
font-4 = "FiraCode Nerd Font:size=19;4"
wm-restack = bspwm
override-redirect = false
enable-ipc = true
cursor-click = pointer
cursor-scroll = default

[bar/primary]
inherit = bar/base
monitor = ${env:POLYBAR_PRIMARY}
modules-left = capl1 bspwm capr1
modules-center = capl2 clock capr2
modules-right = capl3 updates temperature cpu memory capr3 gap1 capl4 volume backlight bluetooth network netspeed battery capr4 gap2 capl5 tray capr5 gap3 capl6 power capr6

[bar/secondary]
inherit = bar/base
monitor = ${env:POLYBAR_SECONDARY}
height = 38
font-4 = "FiraCode Nerd Font:size=21;4"
modules-left = capl1 bspwm capr1
modules-center = capl2 clock capr2
modules-right = capl3 updates temperature cpu memory capr3 gap1 capl4 volume bluetooth network netspeed capr4 gap3 capl6 power capr6

;--------------------------- modules ---------------------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = true
format = <label-state><label-mode>
format-background = ${colors.pill}
format-padding = 1
label-focused = %name%
label-focused-foreground = ${colors.on-accent}
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.on-accent}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-monocle = %{T3}%{T-}
label-monocle-foreground = ${colors.highlight}
label-monocle-padding = 1
label-tiled = ""
label-floating = ""
label-pseudotiled = ""
label-fullscreen = ""
label-locked = ""
label-sticky = ""
label-private = ""
label-marked = ""

[module/clock]
type = internal/date
interval = 1
date = %a %d %b
date-alt = %A, %d %B %Y
time = %H:%M
time-alt = %H:%M:%S
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.highlight}
format-prefix-font = 3
format-background = ${colors.pill}
format-padding = 2
label = %date%  %time%

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800
format-background = ${colors.pill}
label = %{A1:alacritty -e sh -c 'checkupdates | less':}%output%%{A}

[module/temperature]
type = internal/temperature
hwmon-path = ${env:POLYBAR_CPU_TEMP:/sys/class/thermal/thermal_zone0/temp}
warn-temperature = 85
interval = 3
format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.alert}
format-background = ${colors.pill}
format-padding = 1
label = %temperature-c%
label-warn = %temperature-c%
ramp-0 = %{T3}%{T-}
ramp-1 = %{T3}%{T-}
ramp-2 = %{T3}%{T-}
ramp-3 = %{T3}%{T-}
ramp-4 = %{T3}%{T-}
ramp-foreground = ${colors.highlight}

[module/cpu]
; polybar only honours click-* options on some module types, so clicks use %{A} tags in the format
type = internal/cpu
interval = 2
format = %{A1:alacritty -e top:}<ramp-load> <label>%{A}
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
format-prefix-font = 3
format-background = ${colors.pill}
format-padding = 1
label = %percentage:2%%
ramp-load-0 = ▁
ramp-load-1 = ▂
ramp-load-2 = ▃
ramp-load-3 = ▄
ramp-load-4 = ▅
ramp-load-5 = ▆
ramp-load-6 = ▇
ramp-load-7 = █
ramp-load-foreground = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
format-prefix-font = 3
format-background = ${colors.pill}
format-padding = 1
label = %percentage_used:2%%

[module/filesystem]
; not enabled by default (add to modules-right to show disk usage)
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.secondary}
format-mounted-prefix-font = 3
format-mounted-background = ${colors.pill}
format-mounted-padding = 1
label-mounted = %percentage_used%%

[module/volume]
; left-click mute, right-click pavucontrol, scroll = volume (built in)
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = %{A1:#volume.toggle:}%{A3:pavucontrol:} <ramp-volume> <label-volume> %{A}%{A}
format-muted = %{A1:#volume.toggle:}%{A3:pavucontrol:} <label-muted> %{A}%{A}
format-volume-background = ${colors.pill}
format-volume-padding = 0
format-muted-background = ${colors.pill}
format-muted-padding = 0
label-volume = %percentage%%
label-muted = %{T3}%{T-} muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = %{T3}%{T-}
ramp-volume-1 = %{T3}%{T-}
ramp-volume-2 = %{T3}%{T-}
ramp-volume-foreground = ${colors.primary}

[module/backlight]
type = internal/backlight
card = ${env:POLYBAR_BACKLIGHT:intel_backlight}
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.highlight}
format-prefix-font = 3
format-background = ${colors.pill}
format-padding = 1
label = %percentage%%

[module/network]
; left-click: rofi Wi-Fi menu   right-click: toggle the speed readout (netspeed module)
type = internal/network
interface = ${env:POLYBAR_WIFI:wlan0}
interface-type = wireless
interval = 3
format-connected = %{A1:$HOME/.config/rofi/scripts/wifi.sh:}%{A3:#netspeed.module_toggle:} <ramp-signal> <label-connected> %{A}%{A}
format-connected-background = ${colors.pill}
format-connected-padding = 0
format-disconnected = %{A1:$HOME/.config/rofi/scripts/wifi.sh:} <label-disconnected> %{A}
format-disconnected-foreground = ${colors.alert}
format-disconnected-background = ${colors.pill}
format-disconnected-padding = 0
label-connected = %essid%
label-disconnected = %{T3}%{T-} offline
ramp-signal-0 = %{T3}%{T-}
ramp-signal-1 = %{T3}%{T-}
ramp-signal-2 = %{T3}%{T-}
ramp-signal-3 = %{T3}%{T-}
ramp-signal-foreground = ${colors.primary}

[module/netspeed]
; hidden until you right-click the Wi-Fi module
type = internal/network
interface = ${env:POLYBAR_WIFI:wlan0}
interface-type = wireless
interval = 1
hidden = true
format-connected = <label-connected>
format-connected-background = ${colors.pill}
format-connected-padding = 1
format-disconnected =
label-connected = %{T3}%{T-} %downspeed:8% %{T3}%{T-} %upspeed:8%

[module/bluetooth]
; left-click: rofi menu (connect/disconnect paired devices)   right-click: power on/off
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh status
interval = 4
format-background = ${colors.pill}
format-padding = 0
label = %{A1:$HOME/.config/polybar/scripts/bluetooth.sh menu:}%{A3:$HOME/.config/polybar/scripts/bluetooth.sh toggle:} %output% %{A}%{A}

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:ADP0}
full-at = 98
low-at = 15
poll-interval = 10
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.alert}
format-charging-background = ${colors.pill}
format-discharging-background = ${colors.pill}
format-full-background = ${colors.pill}
format-low-background = ${colors.pill}
format-charging-padding = 1
format-discharging-padding = 1
format-full-padding = 1
format-low-padding = 1
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
ramp-capacity-0 = %{T3}%{T-}
ramp-capacity-1 = %{T3}%{T-}
ramp-capacity-2 = %{T3}%{T-}
ramp-capacity-3 = %{T3}%{T-}
ramp-capacity-4 = %{T3}%{T-}
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = %{T3}%{T-}
animation-charging-1 = %{T3}%{T-}
animation-charging-2 = %{T3}%{T-}
animation-charging-3 = %{T3}%{T-}
animation-charging-foreground = ${colors.highlight}
animation-charging-framerate = 700

[module/tray]
; Dedicated tray module (polybar >= 3.6). Only one bar can host the tray, so it lives on the laptop bar.
type = internal/tray
format-margin = 0
tray-spacing = 8px
tray-padding = 4px
tray-size = 16
tray-foreground = ${colors.foreground}
tray-background = ${colors.pill}

[module/power]
type = custom/text
format = %{A1:$HOME/.config/rofi/scripts/powermenu.sh:} %{T3}%{T-} %{A}
format-foreground = ${colors.alert}
format-background = ${colors.pill}
format-padding = 0

[module/capl1]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr1]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capl2]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr2]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capl3]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr3]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capl4]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr4]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capl5]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr5]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capl6]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/capr6]
type = custom/text
format = %{T5}%{T-}
format-foreground = ${colors.pill}

[module/gap1]
type = custom/text
format = " "

[module/gap2]
type = custom/text
format = " "

[module/gap3]
type = custom/text
format = " "

[module/gap4]
type = custom/text
format = " "

[settings]
screenchange-reload = true
pseudo-transparency = false
