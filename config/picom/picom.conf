#   method = "dual_kawase";
#   strength = 7;
#   background = true;
#   background-frame = true;
#   background-fixed = false;
# };
backend = "glx";

blur = {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = true;
  background-fixed = false;
};

corner-radius = 8;
shadow = true;
shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.3;

fading = true;
fade-delta = 5;
fade-in-step = 0.05;
fade-out-step = 0.05;

vsync = true;
